openapi: 3.0.3
info:
  title: SpiderMemos Tab Sync API
  description: |
    SpiderMemos 浏览器标签页同步扩展的后端 API 规范。

    ## 认证方式
    使用 Bearer Token 认证，通过 `Authorization: Bearer <token>` 请求头传递。

    ## 公共请求头
    | Header | 必需 | 说明 |
    |--------|------|------|
    | Authorization | 是（除登录接口外） | Bearer Token |
    | X-Device-Id | 否 | 当前设备 UUID |
    | Content-Type | 是 | application/json |

    ## 公共响应格式
    所有接口返回统一的 `CommonReturn` 格式：
    ```json
    {
      "code": 0,
      "success": true,
      "message": "",
      "developerMessage": "操作成功",
      "data": { ... },
      "traceId": "..."
    }
    ```
    - `code`: 0 表示成功，-1 表示失败
    - `data`: 各接口的实际业务数据
    - `message`: 错误时展示给用户的提示信息

    ## 错误响应格式
    出错时 `success` 为 `false`，`code` 为 -1，`message` 包含错误描述：
    ```json
    {
      "code": -1,
      "success": false,
      "message": "错误描述",
      "developerMessage": "操作失败",
      "data": null,
      "traceId": "..."
    }
    ```
  version: 1.0.0

servers:
  - url: '{baseUrl}'
    description: 用户自行配置的后端地址
    variables:
      baseUrl:
        default: http://localhost:3000

tags:
  - name: Auth
    description: 认证相关接口
  - name: Sync
    description: 标签页数据同步
  - name: Devices
    description: 设备管理

paths:
  # ============ Auth ============
  /v1/tab-sync/auth/login:
    post:
      tags: [Auth]
      summary: 账号密码登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  format: password
                  example: "123456"
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonReturn'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResponse'
        '401':
          description: 用户名或密码错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonReturnError'

  /v1/tab-sync/auth/verify-token:
    post:
      tags: [Auth]
      summary: 验证 Token 有效性
      description: 用于 Token 粘贴模式登录，验证 Token 是否有效并返回用户信息
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: 要验证的 Bearer Token
      responses:
        '200':
          description: Token 有效
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonReturn'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/VerifyTokenResponse'
        '401':
          description: Token 无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonReturnError'

  /v1/tab-sync/auth/logout:
    post:
      tags: [Auth]
      summary: 登出
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  description: 要注销的 Refresh Token
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonReturn'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          ok:
                            type: boolean
                            example: true

  # ============ Sync ============
  /v1/tab-sync/sync/events:
    post:
      tags: [Sync]
      summary: 增量事件同步
      description: 上传本地标签页变更事件到后端
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncEventsRequest'
      responses:
        '200':
          description: 同步成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonReturn'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SyncEventsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/tab-sync/sync/full:
    post:
      tags: [Sync]
      summary: 全量状态对账
      description: 将本设备的完整标签页状态发送到后端进行比对合并
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncFullRequest'
      responses:
        '200':
          description: 对账成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonReturn'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SyncFullResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/tab-sync/sync/pull:
    get:
      tags: [Sync]
      summary: 拉取其他设备的变更
      description: 获取指定时间戳之后、来自其他设备的标签页变更事件
      security:
        - bearerAuth: []
      parameters:
        - name: deviceId
          in: query
          required: true
          schema:
            type: string
          description: 当前设备 ID，用于排除自身事件
        - name: since
          in: query
          required: true
          schema:
            type: string
          description: 上次同步时间（ISO 8601），仅返回此时间之后的事件
      responses:
        '200':
          description: 拉取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonReturn'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SyncPullResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============ Devices ============
  /v1/tab-sync/devices:
    get:
      tags: [Devices]
      summary: 获取当前用户的所有已注册设备
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 设备列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonReturn'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          devices:
                            type: array
                            items:
                              $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/tab-sync/devices/register:
    post:
      tags: [Devices]
      summary: 注册或更新设备信息
      description: 设备首次连接时注册，已存在则更新信息
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, name, browser, os]
              properties:
                deviceId:
                  type: string
                  format: uuid
                  description: 扩展本地生成的设备 UUID
                name:
                  type: string
                  description: 设备名称
                  example: Chrome on Windows
                browser:
                  type: string
                  example: Chrome
                os:
                  type: string
                  example: Windows
      responses:
        '200':
          description: 注册/更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonReturn'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          device:
                            $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/tab-sync/devices/{deviceId}:
    patch:
      tags: [Devices]
      summary: 更新设备信息
      security:
        - bearerAuth: []
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 新的设备名称
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonReturn'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          device:
                            $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 设备不存在

  /v1/tab-sync/devices/{deviceId}/heartbeat:
    post:
      tags: [Devices]
      summary: 设备心跳
      description: 定期调用（默认每分钟），用于更新设备的最后活跃时间
      security:
        - bearerAuth: []
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 心跳成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonReturn'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          ok:
                            type: boolean
                            example: true
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 通过登录或 Token 粘贴获取

  responses:
    Unauthorized:
      description: 未认证或 Token 无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommonReturnError'

  schemas:
    # ---- Common ----
    CommonReturn:
      type: object
      required: [code, success, data]
      properties:
        code:
          type: integer
          description: 0 表示成功，-1 表示失败
        success:
          type: boolean
        message:
          type: string
          description: 展示给用户的信息
        developerMessage:
          type: string
          description: 面向开发者的调试信息
        data:
          type: object
          description: 实际业务数据
        traceId:
          type: string
          description: 请求追踪 ID

    CommonReturnError:
      type: object
      required: [code, success, message]
      properties:
        code:
          type: integer
          example: -1
        success:
          type: boolean
          example: false
        message:
          type: string
          description: 错误描述
        developerMessage:
          type: string
          example: 操作失败
        data:
          nullable: true
        traceId:
          type: string

    # ---- Auth ----
    AuthUser:
      type: object
      required: [id, username]
      properties:
        id:
          type: string
        username:
          type: string

    LoginResponse:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken:
          type: string
          description: 短期访问令牌（Bearer Token）
        refreshToken:
          type: string
          description: 长期刷新令牌，用于获取新的 accessToken
        user:
          $ref: '#/components/schemas/AuthUser'

    VerifyTokenResponse:
      type: object
      required: [valid, user]
      properties:
        valid:
          type: boolean
        user:
          $ref: '#/components/schemas/AuthUser'

    # ---- Tab ----
    TabRecord:
      type: object
      required: [id, chromeTabId, windowId, url, title, favIconUrl, status, openedAt, lastAccessedAt, deviceId, workspaceIds]
      properties:
        id:
          type: string
          format: uuid
          description: 扩展生成的 UUID（跨设备唯一标识）
        chromeTabId:
          type: integer
          description: Chrome 本地 tabId（仅本地有意义）
        windowId:
          type: integer
          description: 所在窗口 ID
        url:
          type: string
          format: uri
        title:
          type: string
        favIconUrl:
          type: string
        status:
          type: string
          enum: [open, closed, archived]
        openedAt:
          type: string
          format: date-time
        lastAccessedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
          nullable: true
        deviceId:
          type: string
          format: uuid
        workspaceIds:
          type: array
          items:
            type: string

    TabEvent:
      type: object
      required: [id, type, tabRecord, timestamp, deviceId]
      properties:
        id:
          type: string
          format: uuid
          description: 事件 UUID
        type:
          type: string
          enum: [created, updated, removed, activated]
        tabRecord:
          $ref: '#/components/schemas/TabRecord'
        timestamp:
          type: string
          format: date-time
        deviceId:
          type: string
          format: uuid

    # ---- Sync ----
    SyncEventsRequest:
      type: object
      required: [deviceId, events]
      properties:
        deviceId:
          type: string
          format: uuid
        events:
          type: array
          items:
            $ref: '#/components/schemas/TabEvent'

    SyncEventsResponse:
      type: object
      required: [processed, conflicts]
      properties:
        processed:
          type: integer
          description: 成功处理的事件数量
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/TabEvent'
          description: 冲突事件列表

    SyncFullRequest:
      type: object
      required: [deviceId, tabs, timestamp]
      properties:
        deviceId:
          type: string
          format: uuid
        tabs:
          type: array
          items:
            $ref: '#/components/schemas/TabRecord'
        timestamp:
          type: string
          format: date-time

    SyncFullResponse:
      type: object
      required: [merged, conflicts]
      properties:
        merged:
          type: array
          items:
            $ref: '#/components/schemas/TabRecord'
          description: 合并后的完整标签页列表
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/TabRecord'
          description: 存在冲突需要手动处理的标签页

    SyncPullResponse:
      type: object
      required: [events, serverTimestamp]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/TabEvent'
          description: 其他设备的变更事件
        serverTimestamp:
          type: string
          format: date-time
          description: 服务端当前时间，客户端下次拉取时作为 since 参数

    # ---- Device ----
    Device:
      type: object
      required: [id, name, browser, os, lastSeen]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Chrome on Windows
        browser:
          type: string
          example: Chrome
        os:
          type: string
          example: Windows
        lastSeen:
          type: string
          format: date-time
