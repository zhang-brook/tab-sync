name: Go CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install build deps
        run: sudo apt-get install -y build-essential

      - name: Build
        run: go build ./cmd/server/...

      - name: Test
        run: go test ./internal/... -v -count=1
