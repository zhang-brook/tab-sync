version: "3.8"

# ============================================================
# Tab Sync Server - 部署编排
# ============================================================
# 单机部署：docker compose up -d
# 反向代理部署：参考下方 nginx 服务（取消注释即可）
# ============================================================

services:
  # ---- 主服务 ----
  tab-sync-server:
    build: .
    container_name: tab-sync-server
    ports:
      - "8080:8080"
    volumes:
      - tab-sync-data:/app/data
    environment:
      # ---- 基础配置 ----
      - PORT=8080
      - DATA_DIR=/app/data
      - LOG_LEVEL=info                # debug | info | warn | error
      - LOG_OUTPUT=stdout             # stdout | stderr | 文件路径

      # ---- 版本兼容性 ----
      - SERVER_VERSION=1.0.0
      - MIN_EXT_VERSION=1.0.0
      - MAX_EXT_VERSION=2.0.0

      # ---- 安全 ----
      # 生产环境务必修改 JWT_SECRET。
      # 用于签名管理后台的 JWT 会话（不影响 API Token）。
      - JWT_SECRET=change-me-in-production-use-random-string

      # ---- 织个网上游对接（预留，暂不启用） ----
      # - UPSTREAM_URL=https://zhige.example.com
      # - UPSTREAM_TOKEN=your-upstream-token
    restart: unless-stopped
    # 资源限制（可选）
    # deploy:
    #   resources:
    #     limits:
    #       memory: 128M
    #       cpus: '0.5'

  # ---- Nginx 反向代理（可选：启用 HTTPS + 域名） ----
  # 取消下方注释即可启用：
  #
  # nginx:
  #   image: nginx:alpine
  #   container_name: tab-sync-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #     - ./certs:/etc/nginx/certs:ro          # SSL 证书目录
  #     - certbot-data:/var/www/certbot         # Let's Encrypt 验证
  #   depends_on:
  #     - tab-sync-server
  #   restart: unless-stopped

volumes:
  tab-sync-data:
  # certbot-data:
