<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Sync Server - 初始化设置</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 48px 40px;
      width: 100%;
      max-width: 480px;
    }
    h1 {
      font-size: 28px;
      color: #1a1a2e;
      margin-bottom: 8px;
      text-align: center;
    }
    .subtitle {
      color: #666;
      text-align: center;
      margin-bottom: 32px;
      font-size: 14px;
    }
    .step-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 32px;
    }
    .step-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #e0e0e0;
    }
    .step-dot.active {
      background: #667eea;
    }
    .step-line {
      width: 40px;
      height: 2px;
      background: #e0e0e0;
    }
    .step-line.done {
      background: #667eea;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #333;
      margin-bottom: 6px;
    }
    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 15px;
      transition: border-color 0.2s;
      outline: none;
    }
    input:focus {
      border-color: #667eea;
    }
    .hint {
      font-size: 12px;
      color: #999;
      margin-top: 4px;
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 8px;
    }
    button:hover { opacity: 0.9; }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
    }
    .alert-error {
      background: #fee;
      color: #c33;
      border: 1px solid #fcc;
    }
    .alert-success {
      background: #efe;
      color: #3a3;
      border: 1px solid #cfc;
    }
    .result-box {
      background: #f8f9ff;
      border: 2px dashed #667eea;
      border-radius: 8px;
      padding: 20px;
      margin: 20px 0;
      text-align: center;
    }
    .token-display {
      font-family: 'Courier New', monospace;
      font-size: 14px;
      word-break: break-all;
      background: #1a1a2e;
      color: #4ecb71;
      padding: 12px;
      border-radius: 6px;
      margin: 12px 0;
      user-select: all;
    }
    .warning {
      color: #e67e22;
      font-size: 13px;
      margin-top: 8px;
    }
    .section {
      display: none;
    }
    .section.active {
      display: block;
    }
    .token-list {
      list-style: none;
    }
    .token-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border: 1px solid #eee;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .token-item .info {
      flex: 1;
    }
    .token-item .name {
      font-weight: 600;
      color: #333;
    }
    .token-item .meta {
      font-size: 12px;
      color: #999;
      margin-top: 2px;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-admin { background: #fef3e2; color: #e67e22; }
    .badge-user { background: #e8f4fd; color: #3498db; }
    .badge-revoked { background: #fde8e8; color: #c33; }
    .badge-active { background: #e8fde8; color: #3a3; }
    .btn-small {
      padding: 6px 14px;
      font-size: 13px;
      width: auto;
      margin: 0;
    }
    .btn-danger {
      background: #e74c3c;
    }
    .btn-outline {
      background: transparent;
      border: 2px solid #667eea;
      color: #667eea;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 20px 0;
    }
    .stat-card {
      background: #f8f9ff;
      padding: 16px;
      border-radius: 8px;
      text-align: center;
    }
    .stat-card .number {
      font-size: 28px;
      font-weight: 700;
      color: #667eea;
    }
    .stat-card .label {
      font-size: 12px;
      color: #999;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 步骤 1: 设置管理员密码 -->
    <div id="section-setup" class="section active">
      <h1>Tab Sync Server</h1>
      <p class="subtitle">欢迎使用！请完成初始化设置</p>
      <div class="step-indicator">
        <div class="step-dot active"></div>
        <div class="step-line"></div>
        <div class="step-dot"></div>
        <div class="step-line"></div>
        <div class="step-dot"></div>
      </div>
      <div id="setup-error" class="alert alert-error" style="display:none;"></div>
      <div class="form-group">
        <label>管理员密码</label>
        <input type="password" id="admin-password" placeholder="请设置管理员密码（至少6位）" minlength="6">
        <p class="hint">此密码用于管理后台登录，请妥善保管</p>
      </div>
      <div class="form-group">
        <label>确认密码</label>
        <input type="password" id="admin-password-confirm" placeholder="请再次输入密码" minlength="6">
      </div>
      <button id="btn-setup" onclick="completeSetup()">完成初始化</button>
    </div>

    <!-- 步骤 2: 显示生成的 Token -->
    <div id="section-result" class="section">
      <h1>初始化完成！</h1>
      <p class="subtitle">您的管理员 Token 已生成</p>
      <div class="step-indicator">
        <div class="step-dot active"></div>
        <div class="step-line done"></div>
        <div class="step-dot active"></div>
        <div class="step-line"></div>
        <div class="step-dot"></div>
      </div>
      <div class="result-box">
        <p style="color:#666;font-size:14px;">请在浏览器扩展中填写以下信息：</p>
        <div style="margin-top:12px;">
          <strong>Token（API Key）：</strong>
          <div class="token-display" id="result-token"></div>
        </div>
        <p class="warning">⚠ 此 Token 仅显示一次，请立即复制保存！</p>
      </div>
      <button id="btn-goto-admin" onclick="gotoAdmin()">进入管理后台</button>
    </div>

    <!-- 管理后台 -->
    <div id="section-admin" class="section">
      <h1>管理后台</h1>
      <p class="subtitle" id="admin-server-info"></p>
      <div id="admin-error" class="alert alert-error" style="display:none;"></div>
      <div id="admin-content" style="display:none;">
        <!-- 统计 -->
        <div class="stats" id="admin-stats"></div>
        <!-- Token 管理 -->
        <h3 style="margin-top:24px;margin-bottom:12px;color:#333;">Token 管理</h3>
        <div id="new-token-section" style="display:none;" class="result-box">
          <p style="color:#666;font-size:14px;">新 Token 已生成：</p>
          <div class="token-display" id="new-token-value"></div>
          <p class="warning">⚠ 此 Token 仅显示一次！</p>
        </div>
        <div class="form-group">
          <label>Token 名称（备注）</label>
          <div style="display:flex;gap:8px;">
            <input type="text" id="new-token-name" placeholder="例如：我的 Chrome 浏览器" style="flex:1;">
            <button class="btn-small" onclick="generateToken()" style="flex-shrink:0;">生成</button>
          </div>
        </div>
        <ul class="token-list" id="token-list"></ul>
        <!-- 退出 -->
        <button class="btn-outline" onclick="logout()" style="margin-top:20px;">退出登录</button>
      </div>
      <!-- 登录表单 -->
      <div id="admin-login">
        <div class="form-group">
          <label>管理员密码</label>
          <input type="password" id="login-password" placeholder="请输入管理员密码">
        </div>
        <button id="btn-login" onclick="adminLogin()">登录</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = '';

    // ============ 初始化流程 ============

    async function completeSetup() {
      const pwd = document.getElementById('admin-password').value;
      const confirm = document.getElementById('admin-password-confirm').value;
      const errEl = document.getElementById('setup-error');

      if (!pwd || pwd.length < 6) {
        showError(errEl, '密码至少需要 6 位');
        return;
      }
      if (pwd !== confirm) {
        showError(errEl, '两次输入的密码不一致');
        return;
      }

      const btn = document.getElementById('btn-setup');
      btn.disabled = true;
      btn.textContent = '正在初始化...';
      hideError(errEl);

      try {
        const res = await fetch(API_BASE + '/api/setup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ adminPassword: pwd })
        });
        const data = await res.json();

        if (res.ok && data.code === 0) {
          document.getElementById('result-token').textContent = data.data.adminToken;
          switchSection('section-result');
          // 存储 JWT 用于后续管理后台登录
          if (data.data.jwt) {
            localStorage.setItem('admin_jwt', data.data.jwt);
          }
        } else {
          showError(errEl, data.msg || '初始化失败');
        }
      } catch (e) {
        showError(errEl, '网络错误：无法连接到服务器');
      } finally {
        btn.disabled = false;
        btn.textContent = '完成初始化';
      }
    }

    function gotoAdmin() {
      switchSection('section-admin');
    }

    // ============ 管理后台 ============

    async function adminLogin() {
      const pwd = document.getElementById('login-password').value;
      const errEl = document.getElementById('admin-error');

      if (!pwd) {
        showError(errEl, '请输入管理员密码');
        return;
      }

      const btn = document.getElementById('btn-login');
      btn.disabled = true;
      btn.textContent = '登录中...';
      hideError(errEl);

      try {
        const res = await fetch(API_BASE + '/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pwd })
        });
        const data = await res.json();

        if (res.ok && data.code === 0) {
          localStorage.setItem('admin_jwt', data.data.jwt);
          await loadAdminPanel();
        } else {
          showError(errEl, data.msg || '密码错误');
        }
      } catch (e) {
        showError(errEl, '网络错误：无法连接到服务器');
      } finally {
        btn.disabled = false;
        btn.textContent = '登录';
      }
    }

    async function loadAdminPanel() {
      const jwt = localStorage.getItem('admin_jwt');
      if (!jwt) {
        document.getElementById('admin-login').style.display = 'block';
        document.getElementById('admin-content').style.display = 'none';
        return;
      }

      document.getElementById('admin-login').style.display = 'none';
      document.getElementById('admin-content').style.display = 'block';

      // 显示服务信息
      try {
        const vRes = await fetch(API_BASE + '/v1/tab-sync/version');
        const vData = await vRes.json();
        if (vData.code === 0) {
          document.getElementById('admin-server-info').textContent =
            'Server v' + vData.data.server_version + ' | API ' + vData.data.api_version;
        }
      } catch (e) {}

      await loadStats();
      await loadTokens();
    }

    async function loadStats() {
      try {
        const res = await fetch(API_BASE + '/v1/tab-sync/admin/stats', {
          headers: { 'Authorization': 'Bearer ' + localStorage.getItem('admin_jwt') }
        });
        const data = await res.json();
        if (data.code === 0) {
          const s = data.data;
          document.getElementById('admin-stats').innerHTML =
            '<div class="stat-card"><div class="number">' + (s.devices || 0) + '</div><div class="label">设备</div></div>' +
            '<div class="stat-card"><div class="number">' + (s.workspaces || 0) + '</div><div class="label">工作组</div></div>' +
            '<div class="stat-card"><div class="number">' + (s.tabs || 0) + '</div><div class="label">标签页</div></div>';
        }
      } catch (e) {}
    }

    async function loadTokens() {
      try {
        const res = await fetch(API_BASE + '/v1/tab-sync/admin/tokens', {
          headers: { 'Authorization': 'Bearer ' + localStorage.getItem('admin_jwt') }
        });
        const data = await res.json();
        if (data.code === 0 && data.data.tokens) {
          renderTokens(data.data.tokens);
        }
      } catch (e) {}
    }

    function renderTokens(tokens) {
      const list = document.getElementById('token-list');
      list.innerHTML = tokens.map(t =>
        '<li class="token-item">' +
          '<div class="info">' +
            '<div class="name">' +
              escapeHtml(t.name || '未命名') + ' ' +
              '<span class="badge ' + (t.isAdmin ? 'badge-admin' : 'badge-user') + '">' +
                (t.isAdmin ? '管理员' : '普通') +
              '</span>' +
              '<span class="badge ' + (t.isRevoked ? 'badge-revoked' : 'badge-active') + '">' +
                (t.isRevoked ? '已吊销' : '有效') +
              '</span>' +
            '</div>' +
            '<div class="meta">ID: ' + escapeHtml(t.tokenId || '') +
              (t.lastUsed ? ' | 最近使用: ' + formatTime(t.lastUsed) : '') +
              ' | 创建: ' + formatTime(t.createdAt) +
            '</div>' +
          '</div>' +
          (t.isRevoked ? '' :
            '<button class="btn-small btn-danger" onclick="revokeToken(\'' + t.tokenId + '\')">吊销</button>'
          ) +
        '</li>'
      ).join('');
    }

    async function generateToken() {
      const name = document.getElementById('new-token-name').value || '未命名 Token';
      try {
        const res = await fetch(API_BASE + '/v1/tab-sync/admin/tokens', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + localStorage.getItem('admin_jwt')
          },
          body: JSON.stringify({ name: name, isAdmin: false })
        });
        const data = await res.json();
        if (data.code === 0) {
          document.getElementById('new-token-value').textContent = data.data.token;
          document.getElementById('new-token-section').style.display = 'block';
          document.getElementById('new-token-name').value = '';
          await loadTokens();
        } else {
          alert(data.msg || '生成失败');
        }
      } catch (e) {
        alert('网络错误');
      }
    }

    async function revokeToken(tokenId) {
      if (!confirm('确认吊销此 Token？吊销后该 Token 将无法使用。')) return;
      try {
        const res = await fetch(API_BASE + '/v1/tab-sync/admin/tokens/' + tokenId, {
          method: 'DELETE',
          headers: { 'Authorization': 'Bearer ' + localStorage.getItem('admin_jwt') }
        });
        const data = await res.json();
        if (data.code === 0) {
          await loadTokens();
        } else {
          alert(data.msg || '吊销失败');
        }
      } catch (e) {
        alert('网络错误');
      }
    }

    function logout() {
      localStorage.removeItem('admin_jwt');
      document.getElementById('admin-login').style.display = 'block';
      document.getElementById('admin-content').style.display = 'none';
    }

    // ============ 辅助函数 ============

    function switchSection(id) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      if (id === 'section-admin') {
        loadAdminPanel();
      }
    }

    function showError(el, msg) {
      el.textContent = msg;
      el.style.display = 'block';
    }

    function hideError(el) {
      el.style.display = 'none';
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function formatTime(ts) {
      if (!ts) return '-';
      const d = new Date(ts);
      return d.toLocaleString('zh-CN');
    }

    // 页面加载时检测状态
    (async function init() {
      try {
        const res = await fetch(API_BASE + '/api/setup/status');
        const data = await res.json();
        if (data.code === 0 && data.data.setupDone) {
          switchSection('section-admin');
        }
      } catch (e) {
        // 服务未启动，什么都不做
      }
    })();
  </script>
</body>
</html>
